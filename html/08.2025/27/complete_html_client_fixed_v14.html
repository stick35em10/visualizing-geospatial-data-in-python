<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sheets App Client - v14</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Arial,sans-serif;margin:0;background:#0b1020;color:#e6ecff}
    header{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:16px 20px;background:#0f1530;border-bottom:1px solid #1c274f;position:sticky;top:0;z-index:10}
    h1{font-size:18px;margin:0}
    .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
    select, input, button{background:#11183a;color:#e6ecff;border:1px solid #263276;border-radius:10px;padding:10px 12px}
    button{cursor:pointer;transition:all 0.2s}
    button:hover:not([disabled]){background:#1a2550}
    button[disabled]{opacity:.5;cursor:not-allowed}
    main{padding:20px}
    .status{margin:12px 0;padding:14px;border-radius:12px;border:1px solid #2a3a85;background:#0e1433}
    .status.success{border-color:#1f8f55;background:#0e2a1b}
    .status.error{border-color:#d43c3c;background:#2a0e14}
    .status.warn{border-color:#caa53b;background:#2a230e}
    .grid{display:grid;gap:14px}
    .panel{padding:16px;border:1px solid #21306d;background:#0e1433;border-radius:14px}
    .table-wrapper{overflow:auto;border-radius:12px;border:1px solid #24327b;max-height:500px}
    table{width:100%;border-collapse:collapse;background:#0b1020}
    thead th{position:sticky;top:0;background:#0f1638;border-bottom:1px solid #24327b;padding:12px 10px}
    th,td{padding:8px 10px;border-bottom:1px dashed #1b244f;vertical-align:top}
    .cell-url img{max-width:120px;max-height:90px;border-radius:10px;border:1px solid #2a3a85;cursor:pointer}
    .controls{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
    .note{font-size:12px;opacity:.8}
    .banner{position:sticky;top:62px;margin:-10px 0 10px;padding:10px 12px;border-radius:10px}
    .banner.warn{background:#2a230e;border:1px solid #caa53b}
    .upload-section{background:#0e1433;border:2px dashed #263276;border-radius:12px;padding:20px;text-align:center;margin-top:20px}
    .upload-section.dragover{border-color:#1f8f55;background:#0e2a1b}
    .file-input{display:none}
    .upload-button{background:#1a4b8c;color:white;padding:12px 20px;border:none;border-radius:8px;cursor:pointer;font-size:14px}
    .upload-button:hover{background:#2260a8}
    .form-row{display:flex;gap:10px;margin:10px 0;align-items:center}
    .form-row label{min-width:100px;font-size:14px}
    .form-row input, .form-row select, .form-row textarea{flex:1}
    textarea{resize:vertical;min-height:60px}
    .upload-results{margin-top:15px;padding:10px;border-radius:8px;background:#0b1020}
    .file-preview{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}
    .file-item{position:relative;border:1px solid #263276;border-radius:8px;padding:5px;background:#11183a}
    .file-item img{max-width:100px;max-height:75px;border-radius:4px}
    .file-item .remove-btn{position:absolute;top:-5px;right:-5px;background:#d43c3c;color:white;border:none;border-radius:50%;width:20px;height:20px;cursor:pointer;font-size:12px}
    .modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);z-index:1000}
    .modal-content{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);max-width:90%;max-height:90%;background:#0e1433;border-radius:12px;padding:20px}
    .modal img{max-width:100%;max-height:100%;border-radius:8px}
    .modal-close{position:absolute;top:10px;right:15px;background:none;border:none;color:#e6ecff;font-size:24px;cursor:pointer}
    .stats{display:flex;gap:20px;margin:10px 0;font-size:12px;color:#b0c4de}
  </style>
</head>
<body>
  <header>
    <h1>Sheets App Client - v14</h1>
    <div class="row">
      <select id="serverSelect">
        <option value="">Escolha o servidor...</option>
        <option value="http://localhost:5000">http://localhost:5000</option>
        <option value="https://visualizing-geospatial-data-in-python-2.onrender.com">https://visualizing-geospatial-data-in-python-2.onrender.com</option>
      </select>
      <button id="btnTest">🔗 Testar Conexão</button>
      <button id="btnLoad" disabled>📊 Carregar Abas</button>
      <button id="btnUpload" disabled>📸 Upload Fotos</button>
    </div>
  </header>

  <main class="grid">
    <div id="banner" class="banner warn" style="display:none"></div>
    <div id="status" class="status">Selecione um servidor e clique em <strong>Testar Conexão</strong>.</div>
    
    <!-- Data Panel -->
    <div class="panel">
      <div class="controls">
        <label>Aba:</label>
        <select id="sheetSelect" disabled><option value="">Selecione...</option></select>
        <input id="search" placeholder="Buscar..." />
        <select id="entries">
          <option value="25">25</option>
          <option value="50">50</option>
          <option value="100">100</option>
          <option value="all">Todas</option>
        </select>
        <button id="btnRefresh" disabled>🔄 Atualizar</button>
      </div>
      <div class="stats" id="dataStats"></div>
      <div id="data"></div>
    </div>

    <!-- Upload Panel -->
    <div class="panel" id="uploadPanel" style="display:none;">
      <h3>📸 Upload de Fotos</h3>
      <form id="uploadForm">
        <div class="form-row">
          <label>Título:</label>
          <input type="text" id="photoTitle" placeholder="Título da foto" required />
        </div>
        <div class="form-row">
          <label>Descrição:</label>
          <textarea id="photoDescription" placeholder="Descrição opcional"></textarea>
        </div>
        <div class="form-row">
          <label>Aba destino:</label>
          <select id="uploadSheet">
            <option value="Imagens">Imagens</option>
            <option value="Fotos">Fotos</option>
          </select>
        </div>
        <div class="form-row">
          <label>Localização:</label>
          <button type="button" id="btnLocation">📍 Obter Localização</button>
          <span id="locationStatus"></span>
        </div>
        
        <div class="upload-section" id="uploadZone">
          <p>📁 Arraste fotos aqui ou clique para selecionar</p>
          <input type="file" id="photoFiles" class="file-input" multiple accept="image/*" />
          <button type="button" class="upload-button" id="selectFilesBtn">Selecionar Fotos</button>
        </div>

        <div class="file-preview" id="filePreview"></div>
        
        <div class="form-row" style="justify-content:center;margin-top:20px">
          <button type="submit" class="upload-button" disabled id="submitUpload">🚀 Enviar Fotos</button>
        </div>
      </form>
      
      <div id="uploadResults" class="upload-results" style="display:none;"></div>
    </div>
  </main>

  <!-- Image Modal -->
  <div id="imageModal" class="modal">
    <div class="modal-content">
      <button class="modal-close" onclick="closeModal()">&times;</button>
      <img id="modalImage" src="" alt="Imagem ampliada" />
    </div>
  </div>

  <script>
    // ------- State -------
    let SERVER_URL = "";
    let isConnected = false;
    let allData = [];
    let selectedFiles = [];
    let currentLocation = null;

    const els = {
      serverSelect: document.getElementById('serverSelect'),
      btnTest: document.getElementById('btnTest'),
      btnLoad: document.getElementById('btnLoad'),
      btnUpload: document.getElementById('btnUpload'),
      btnRefresh: document.getElementById('btnRefresh'),
      status: document.getElementById('status'),
      banner: document.getElementById('banner'),
      data: document.getElementById('data'),
      dataStats: document.getElementById('dataStats'),
      sheetSelect: document.getElementById('sheetSelect'),
      search: document.getElementById('search'),
      entries: document.getElementById('entries'),
      uploadPanel: document.getElementById('uploadPanel'),
      uploadForm: document.getElementById('uploadForm'),
      photoFiles: document.getElementById('photoFiles'),
      filePreview: document.getElementById('filePreview'),
      submitUpload: document.getElementById('submitUpload'),
      uploadResults: document.getElementById('uploadResults'),
      btnLocation: document.getElementById('btnLocation'),
      locationStatus: document.getElementById('locationStatus')
    };

    function showMessage(html, kind='info', timeout=0){
      els.status.className = 'status ' + (kind==='error'?'error':kind==='success'?'success':kind==='warning'?'warn':'')
      els.status.innerHTML = html;
      if(timeout>0){ setTimeout(()=>{ els.status.className='status'; els.status.innerHTML=''; }, timeout); }
    }
    function showBanner(msg){
      els.banner.textContent = msg;
      els.banner.style.display = 'block';
    }
    function hideBanner(){ els.banner.style.display = 'none'; }
    function showLoading(msg){ showMessage(`⏳ ${msg}`); }
    function resetConnection(){
      isConnected = false;
      els.btnLoad.disabled = true;
      els.btnUpload.disabled = true;
      els.btnRefresh.disabled = true;
      els.sheetSelect.disabled = true;
      els.uploadPanel.style.display = 'none';
      els.data.innerHTML = '';
    }

    async function makeRequest(path, options={}){
      const url = SERVER_URL.replace(/\/$/, '') + path;
      try {
        const res = await fetch(url, { 
          mode: 'cors',
          credentials: 'omit',
          headers: {
            'Accept': 'application/json',
            'Content-Type': 'application/json'
          },
          ...options
        });
        
        if(!res.ok){
          const txt = await res.text().catch(()=>'Network error');
          throw new Error(`HTTP ${res.status}: ${txt}`);
        }
        return res.json();
      } catch (error) {
        if (error.name === 'TypeError' && error.message.includes('fetch')) {
          throw new Error(`Conexão falhou. Verifique se o servidor está rodando em: ${SERVER_URL}`);
        }
        throw error;
      }
    }

    // ------- Connection test -------
    async function testConnection(){
      if(!SERVER_URL){ showMessage('❌ Selecione um servidor.', 'error'); return; }
      showLoading('Testando conexão...');
      els.btnTest.disabled = true;
      try{
        const sheetsResult = await makeRequest('/debug/full');
        const cloudResult = await makeRequest('/debug/cloudinary');

        const sheetsOK = !!(sheetsResult && sheetsResult.success);
        const cloudOK = !!(cloudResult && cloudResult.cloudinary_configured);

        showMessage(`
          ✅ <strong>Conexão Estabelecida</strong><br>
          Sheets: ${sheetsOK ? '✅' : '❌'} |
          Cloudinary: ${cloudOK ? '✅' : '❌'}<br>
          Tempo: ${Number(sheetsResult?.duration_seconds||0).toFixed(2)}s
        `, 'success');

        isConnected = sheetsOK;
        els.btnLoad.disabled = !sheetsOK;
        els.btnRefresh.disabled = !sheetsOK;
        els.btnUpload.disabled = !(sheetsOK && cloudOK);
        els.sheetSelect.disabled = !sheetsOK;

        if(sheetsOK && cloudOK) {
          els.uploadPanel.style.display = 'block';
        }

        hideBanner();
        if(!cloudOK && sheetsOK){
          showBanner('Cloudinary não configurado — Upload desativado');
        }
      }catch(err){
        console.error(err);
        showMessage(`❌ Falha na conexão: ${err.message}`, 'error');
        resetConnection();
      }finally{
        els.btnTest.disabled = false;
      }
    }

    // ------- Load worksheets list -------
    async function loadWorksheets(){
      if(!isConnected) return;
      showLoading('Carregando abas...');
      try{
        const result = await makeRequest('/api/sheets/worksheets');
        if(result.success) {
          const worksheets = result.worksheets || [];
          els.sheetSelect.innerHTML = '<option value="">Selecione...</option>' +
            worksheets.map(ws => `<option value="${ws.title}">${ws.title}</option>`).join('');
          
          // Update upload sheet options
          const uploadSheet = document.getElementById('uploadSheet');
          uploadSheet.innerHTML = '<option value="Imagens">Imagens</option>' +
            worksheets.map(ws => `<option value="${ws.title}">${ws.title}</option>`).join('');
            
          showMessage(`✅ ${worksheets.length} abas carregadas.`, 'success', 2000);
        }
      }catch(err){
        showMessage(`❌ Falha ao carregar abas: ${err.message}`, 'error');
      }
    }

    // ------- Load data of a sheet -------
    async function loadData(sheetName){
      if(!sheetName) return;
      showLoading(`Carregando dados da aba "${sheetName}"...`);
      try{
        const result = await makeRequest(`/api/sheets/data?worksheet=${encodeURIComponent(sheetName)}`);
        if(result.success) {
          allData = result.data || [];
          renderTable();
          updateStats(result.metadata);
          showMessage(`✅ ${allData.length} linhas carregadas da aba "${sheetName}".`, 'success', 2500);
        }
      }catch(err){
        showMessage(`❌ Erro ao obter dados: ${err.message}`, 'error');
      }
    }

    // ------- Update stats -------
    function updateStats(metadata) {
      if(!metadata) return;
      els.dataStats.innerHTML = `
        <span>📊 Linhas: ${metadata.total_rows}</span>
        <span>📋 Colunas: ${metadata.total_columns}</span>
        <span>⏰ Atualizado: ${new Date(metadata.last_update).toLocaleString()}</span>
      `;
    }

    // ------- Render Table -------
    function renderTable(){
      if(!allData || allData.length === 0){
        els.data.innerHTML = `<div class="status">Nenhum dado encontrado nesta aba.</div>`;
        return;
      }
      
      const headers = Object.keys(allData[0]);
      let html = `
        <div class="table-wrapper">
          <table class="data-table">
            <thead>
              <tr>${headers.map(h => `<th>${h}</th>`).join('')}</tr>
            </thead>
            <tbody>
      `;
      
      for(const row of allData){
        html += `<tr>`;
        for(const h of headers){
          const cellValue = row[h] ?? '';
          if (typeof cellValue === 'string' && (cellValue.includes('cloudinary.com') || cellValue.includes('res.cloudinary.com'))){
            html += `
              <td class="cell-url">
                <img src="${cellValue}" alt="Imagem" onclick="showImageModal('${cellValue}')">
                <br><a href="${cellValue}" target="_blank" style="font-size:11px">Ver original</a>
              </td>
            `;
          } else if (typeof cellValue === 'string' && cellValue.startsWith('http')){
            html += `<td class="cell-url"><a href="${cellValue}" target="_blank">${cellValue}</a></td>`;
          } else {
            html += `<td>${cellValue}</td>`;
          }
        }
        html += `</tr>`;
      }
      html += `</tbody></table></div>`;
      els.data.innerHTML = html;
      
      // Apply entries filter
      applyEntriesFilter();
    }

    function applyEntriesFilter() {
      const val = els.entries.value;
      const rows = Array.from(els.data.querySelectorAll('tbody tr'));
      rows.forEach((tr,idx)=>{
        tr.style.display = (val==='all' || idx < parseInt(val)) ? '' : 'none';
      });
    }

    // ------- Image modal -------
    function showImageModal(url){
      document.getElementById('modalImage').src = url;
      document.getElementById('imageModal').style.display = 'block';
    }
    function closeModal(){
      document.getElementById('imageModal').style.display = 'none';
    }

    // ------- Location handling -------
    async function getLocation() {
      els.btnLocation.disabled = true;
      els.locationStatus.textContent = '🔍 Obtendo localização...';
      
      if (!navigator.geolocation) {
        els.locationStatus.textContent = '❌ Geolocalização não suportada';
        els.btnLocation.disabled = false;
        return;
      }

      try {
        const position = await new Promise((resolve, reject) => {
          navigator.geolocation.getCurrentPosition(resolve, reject, {
            enableHighAccuracy: true,
            timeout: 10000,
            maximumAge: 60000
          });
        });

        currentLocation = {
          latitude: position.coords.latitude,
          longitude: position.coords.longitude,
          accuracy: position.coords.accuracy
        };

        els.locationStatus.innerHTML = `✅ ${position.coords.latitude.toFixed(6)}, ${position.coords.longitude.toFixed(6)} (±${Math.round(position.coords.accuracy)}m)`;
      } catch (error) {
        els.locationStatus.textContent = `❌ Erro: ${error.message}`;
        currentLocation = null;
      } finally {
        els.btnLocation.disabled = false;
      }
    }

    // ------- File handling -------
    function handleFileSelect(files) {
      selectedFiles = Array.from(files).filter(file => file.type.startsWith('image/'));
      updateFilePreview();
      els.submitUpload.disabled = selectedFiles.length === 0;
    }

    function updateFilePreview() {
      els.filePreview.innerHTML = '';
      selectedFiles.forEach((file, index) => {
        const item = document.createElement('div');
        item.className = 'file-item';
        
        const reader = new FileReader();
        reader.onload = e => {
          item.innerHTML = `
            <img src="${e.target.result}" alt="${file.name}">
            <div style="font-size:11px;margin-top:5px">${file.name}</div>
            <button class="remove-btn" onclick="removeFile(${index})">&times;</button>
          `;
        };
        reader.readAsDataURL(file);
        
        els.filePreview.appendChild(item);
      });
    }

    function removeFile(index) {
      selectedFiles.splice(index, 1);
      updateFilePreview();
      els.submitUpload.disabled = selectedFiles.length === 0;
    }

    // ------- Upload handling -------
    async function uploadPhotos(event) {
      event.preventDefault();
      
      if (selectedFiles.length === 0) {
        showMessage('❌ Selecione pelo menos uma foto.', 'error');
        return;
      }

      const formData = new FormData();
      formData.append('title', document.getElementById('photoTitle').value);
      formData.append('description', document.getElementById('photoDescription').value);
      formData.append('worksheet', document.getElementById('uploadSheet').value);
      
      if (currentLocation) {
        formData.append('latitude', currentLocation.latitude);
        formData.append('longitude', currentLocation.longitude);
        formData.append('accuracy', currentLocation.accuracy);
      }

      selectedFiles.forEach(file => {
        formData.append('photos', file);
      });

      showLoading(`Enviando ${selectedFiles.length} foto(s)...`);
      els.submitUpload.disabled = true;

      try {
        const response = await fetch(SERVER_URL + '/api/upload/photos', {
          method: 'POST',
          mode: 'cors',
          credentials: 'omit',
          body: formData
        });

        const result = await response.json();

        if (result.success) {
          showMessage(`✅ ${result.uploaded_count} foto(s) enviada(s) com sucesso!`, 'success');
          
          // Show results
          els.uploadResults.style.display = 'block';
          els.uploadResults.innerHTML = `
            <h4>✅ Upload Concluído</h4>
            <p><strong>Planilha:</strong> ${result.spreadsheet_title}</p>
            <p><strong>Aba:</strong> ${result.worksheet}</p>
            <p><strong>Arquivos processados:</strong> ${result.results.length}</p>
            ${result.results.map(r => 
              r.status === 'success' 
                ? `<div>✅ ${r.filename} (${r.dimensions})</div>`
                : `<div>❌ ${r.filename}: ${r.error}</div>`
            ).join('')}
          `;

          // Reset form
          els.uploadForm.reset();
          selectedFiles = [];
          updateFilePreview();
          currentLocation = null;
          els.locationStatus.textContent = '';
        } else {
          showMessage(`❌ Erro no upload: ${result.message}`, 'error');
        }
      } catch (error) {
        showMessage(`❌ Erro no upload: ${error.message}`, 'error');
      } finally {
        els.submitUpload.disabled = false;
      }
    }

    // ------- Events -------
    els.serverSelect.addEventListener('change', e => {
      SERVER_URL = e.target.value || "";
      resetConnection();
    });

    els.btnTest.addEventListener('click', testConnection);
    els.btnLoad.addEventListener('click', loadWorksheets);
    els.btnRefresh.addEventListener('click', () => loadData(els.sheetSelect.value));
    els.sheetSelect.addEventListener('change', e => loadData(e.target.value));
    
    els.search.addEventListener('input', () => {
      const q = els.search.value.trim().toLowerCase();
      if(!q){ renderTable(); return; }
      const headers = allData.length ? Object.keys(allData[0]) : [];
      const filtered = allData.filter(r => headers.some(h => String(r[h]??'').toLowerCase().includes(q)));
      const backup = allData;
      allData = filtered;
      renderTable();
      allData = backup;
    });

    els.entries.addEventListener('change', applyEntriesFilter);

    // Upload events
    els.btnLocation.addEventListener('click', getLocation);
    els.uploadForm.addEventListener('submit', uploadPhotos);
    
    document.getElementById('selectFilesBtn').addEventListener('click', () => {
      els.photoFiles.click();
    });

    els.photoFiles.addEventListener('change', e => {
      handleFileSelect(e.target.files);
    });

    // Drag and drop
    const uploadZone = document.getElementById('uploadZone');
    uploadZone.addEventListener('dragover', e => {
      e.preventDefault();
      uploadZone.classList.add('dragover');
    });

    uploadZone.addEventListener('dragleave', () => {
      uploadZone.classList.remove('dragover');
    });

    uploadZone.addEventListener('drop', e => {
      e.preventDefault();
      uploadZone.classList.remove('dragover');
      handleFileSelect(e.dataTransfer.files);
    });

    // Show/hide upload panel
    els.btnUpload.addEventListener('click', () => {
      const panel = els.uploadPanel;
      panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
    });

    // Close modal on click outside
    document.getElementById('imageModal').addEventListener('click', e => {
      if (e.target.id === 'imageModal') closeModal();
    });
  </script>
</body>
</html>
