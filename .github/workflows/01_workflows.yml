name: CI with Artifact

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas matplotlib

      - name: Unzip data file
        run: |
          mkdir -p data
          unzip -o data/Metro_Nashville_Police_Department_Incidents.zip -d data

      - name: Run plot.py
        env:
          RUN_DATE: ${{ github.run_started_at }}
          RUN_NUMBER: ${{ github.run_number }}
        run: python plot.py

      - name: Upload plot image as artifact
        uses: actions/upload-artifact@v4
        with:
          name: school-plot-${{ github.run_number }}
          path: img/
